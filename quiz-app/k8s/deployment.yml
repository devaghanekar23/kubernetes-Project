
apiVersion: apps/v1
kind: Deployment

metadata:
  name: quizmaster-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: quizmaster

  template:
    metadata:
      labels:
        app: quizmaster

    spec:
      containers:
        - name: quizmaster
          image: devaghanekar/quiz-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

